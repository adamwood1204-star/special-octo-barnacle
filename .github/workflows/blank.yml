
name: "Build Laura's Christmas App v2.1 - Connection Fix"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Christmas App v2.1
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found"
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Version 2.1
        shell: bash
        run: |
          if [ ! -f lauras_christmas_v21_connected_source.zip ]; then
            echo "::error::Upload lauras_christmas_v21_connected_source.zip to the repository root first"
            exit 1
          fi

          unzip -oq lauras_christmas_v21_connected_source.zip

          test -f christmas_organiser_android/app/build.gradle

      - name: Verify Version 2.1 connection fix
        shell: bash
        run: |
          APP=christmas_organiser_android

          grep -Fq "versionName '2.1.0'" "$APP/app/build.gradle" || {
            echo "::error::Wrong app version"
            exit 1
          }

          grep -Fq 'checkConnection()' "$APP/app/src/main/java/uk/co/christmas/organiser/MainActivity.java" || {
            echo "::error::Connection test missing"
            exit 1
          }

          echo "Version 2.1 connection fix verified"

      - name: Build Android APK
        working-directory: christmas_organiser_android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist

          cp christmas_organiser_android/app/build/outputs/apk/debug/app-debug.apk \
            dist/Lauras-Christmas-App-v2-1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauras-Christmas-App-v2-1-Connection-Fix
          path: dist/Lauras-Christmas-App-v2-1.apk
          if-no-files-found: error
          retention-days: 30
