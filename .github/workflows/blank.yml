
name: Build Laura's Christmas App V2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Laura's Christmas App V2
    runs-on: ubuntu-24.04

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found"
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Laura's Christmas App V2
        shell: bash
        run: |
          test -f christmas_organiser_android_source.zip || {
            echo "::error::Upload christmas_organiser_android_source.zip to the repository root"
            exit 1
          }
          unzip -oq christmas_organiser_android_source.zip
          test -f christmas_organiser_android/app/build.gradle

      - name: Confirm new Version 2 source
        shell: bash
        run: |
          APP_DIR="christmas_organiser_android"
          APP_JS="$APP_DIR/app/src/main/assets/app.js"
          APP_GRADLE="$APP_DIR/app/build.gradle"
          test -f "$APP_JS"

          if ! grep -q 'Christmas Scout' "$APP_JS"; then
            echo "::error::Old ZIP detected. Replace christmas_organiser_android_source.zip with the new V2 file."
            exit 1
          fi

          if ! grep -q "versionName '2.0.0'" "$APP_GRADLE"; then
            echo "::error::Version 2.0.0 was not found in the source ZIP."
            exit 1
          fi

          echo "Correct Version 2 source confirmed"

      - name: Build Laura's Christmas App V2 APK
        working-directory: christmas_organiser_android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp christmas_organiser_android/app/build/outputs/apk/debug/app-debug.apk \
            dist/Lauras-Christmas-App-V2.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauras-Christmas-App-V2
          path: dist/Lauras-Christmas-App-V2.apk
          if-no-files-found: error
          retention-days: 30
