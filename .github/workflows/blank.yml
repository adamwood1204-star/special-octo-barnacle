
name: Build Laura's Christmas App V2 - New ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Laura's Christmas App V2
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found"
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract new Version 2 ZIP
        shell: bash
        run: |
          if [ ! -f lauras_christmas_v2_source.zip ]; then
            echo "::error::Upload lauras_christmas_v2_source.zip to the repository root"
            exit 1
          fi

          unzip -oq lauras_christmas_v2_source.zip

          test -f christmas_organiser_android/app/build.gradle

      - name: Verify new app features
        shell: bash
        run: |
          APP_JS=christmas_organiser_android/app/src/main/assets/app.js
          APP_GRADLE=christmas_organiser_android/app/build.gradle

          grep -q 'Christmas Scout' "$APP_JS" || {
            echo "::error::Christmas Scout is missing"
            exit 1
          }

          grep -q 'secretTitleTap' "$APP_JS" || {
            echo "::error::Hidden Elf Ideas is missing"
            exit 1
          }

          grep -q 'presentIconTap' "$APP_JS" || {
            echo "::error::Hidden Present Lists are missing"
            exit 1
          }

          grep -q "versionName '2.0.0'" "$APP_GRADLE" || {
            echo "::error::Wrong app version"
            exit 1
          }

          echo "Version 2 verified"

      - name: Build Android APK
        working-directory: christmas_organiser_android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Name APK
        shell: bash
        run: |
          mkdir -p dist

          cp christmas_organiser_android/app/build/outputs/apk/debug/app-debug.apk \
            dist/Lauras-Christmas-App-V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauras-Christmas-App-V2
          path: dist/Lauras-Christmas-App-V2.apk
          if-no-files-found: error
          retention-days: 30
