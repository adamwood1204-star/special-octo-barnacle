
name: Build Laura's Christmas App v2.1.2 - News Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo '::error::Android SDK manager missing'; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract existing Version 2 source
        shell: bash
        run: |
          test -f lauras_christmas_v2_source.zip || { echo '::error::V2 ZIP missing'; exit 1; }
          unzip -oq lauras_christmas_v2_source.zip
          test -f christmas_organiser_android/app/build.gradle

      - name: Apply Christmas news and connection fixes
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          root=Path('christmas_organiser_android')
          jf=root/'app/src/main/java/uk/co/christmas/organiser/MainActivity.java'
          sf=root/'app/src/main/assets/app.js'
          gf=root/'app/build.gradle'
          java=jf.read_text(encoding='utf-8')
          js=sf.read_text(encoding='utf-8')
          gradle=gf.read_text(encoding='utf-8')
          assert "versionName '2.0.0'" in gradle and 'Christmas Scout' in js
          assert 'android.permission.INTERNET' in (root/'app/src/main/AndroidManifest.xml').read_text()
          java=java.replace('Executors.newSingleThreadExecutor()', 'Executors.newFixedThreadPool(3)',1)
          marker='''        public void fetchNews() {
                      executor.submit(() -> callback("onNativeNews", requestNews()));
                  }
          '''
          assert marker in java
          java=java.replace(marker, marker+'''
                  @JavascriptInterface
                  public void checkConnection() {
                      executor.submit(() -> callback("onNativeConnection", testConnection()));
                  }
          ''',1)
          start=java.index('    private JSONObject requestNews() {')
          end=java.index('    private String childText(',start)
          java=java[:start]+'''    private String networkError(Exception e) {
                  if(e instanceof java.net.UnknownHostException) return "DNS lookup failed";
                  if(e instanceof java.net.SocketTimeoutException) return "Connection timed out";
                  if(e instanceof javax.net.ssl.SSLException) return "HTTPS connection failed";
                  return e.getClass().getSimpleName();
              }
              private JSONObject testConnection() {
                  JSONArray checks=new JSONArray();
                  String[][] sites={
                      {"Internet","https://www.google.com/generate_204"},
                      {"Christmas News","https://news.google.com/rss/search?q=Christmas%20UK&hl=en-GB&gl=GB&ceid=GB%3Aen"},
                      {"OpenAI","https://api.openai.com/v1/models"}
                  };
                  try {
                      for(String[] site:sites) {
                          JSONObject row=new JSONObject().put("name",site[0]);
                          HttpURLConnection c=null;
                          try {
                              c=(HttpURLConnection)new URL(site[1]).openConnection();
                              c.setConnectTimeout(6500);c.setReadTimeout(6500);
                              int status=c.getResponseCode();
                              row.put("ok",status>=200&&status<500);
                              row.put("detail","HTTP "+status+(status==401&&site[0].equals("OpenAI")?" (reachable)":""));
                          } catch(Exception e) {
                              row.put("ok",false).put("detail",networkError(e));
                          } finally {if(c!=null)c.disconnect();}
                          checks.put(row);
                      }
                      return new JSONObject().put("ok",true).put("checks",checks);
                  } catch(Exception e) {return error("Connection test failed");}
              }
              private JSONArray parseRss(String xml) throws Exception {
                  // Android's non-validating XML pull parser avoids unsupported JAXP settings.
                  org.xmlpull.v1.XmlPullParser p=android.util.Xml.newPullParser();
                  p.setInput(new java.io.StringReader(xml));
                  JSONArray found=new JSONArray();
                  boolean inside=false;int depth=-1;
                  String title="",link="",date="",source="";
                  int event=p.getEventType();
                  while(event!=org.xmlpull.v1.XmlPullParser.END_DOCUMENT&&found.length()<12) {
                      if(event==org.xmlpull.v1.XmlPullParser.START_TAG) {
                          String tag=p.getName();
                          if("item".equalsIgnoreCase(tag)) {
                              inside=true;depth=p.getDepth();
                              title="";link="";date="";source="";
                          } else if(inside&&p.getDepth()==depth+1) {
                              if("title".equalsIgnoreCase(tag))title=p.nextText();
                              else if("link".equalsIgnoreCase(tag))link=p.nextText();
                              else if("pubDate".equalsIgnoreCase(tag))date=p.nextText();
                              else if("source".equalsIgnoreCase(tag))source=p.nextText();
                          }
                      } else if(event==org.xmlpull.v1.XmlPullParser.END_TAG&&inside
                                &&p.getDepth()==depth&&"item".equalsIgnoreCase(p.getName())) {
                          title=title.trim();link=link.trim();
                          if(!title.isEmpty()&&link.startsWith("https://")) {
                              found.put(new JSONObject()
                                  .put("title",title.length()>250?title.substring(0,250):title)
                                  .put("url",link).put("date",date.trim()).put("source",source.trim()));
                          }
                          inside=false;
                      }
                      event=p.next();
                  }
                  return found;
              }
              private JSONObject requestNews() {
                  String[] feeds={
                      "https://news.google.com/rss/search?q=Christmas%20UK&hl=en-GB&gl=GB&ceid=GB%3Aen",
                      "https://www.bing.com/news/search?q=Christmas+UK&format=rss"
                  };
                  String problem="No news articles found";
                  for(String address:feeds) {
                      HttpURLConnection c=null;
                      try {
                          c=(HttpURLConnection)new URL(address).openConnection();
                          c.setConnectTimeout(9000);c.setReadTimeout(12000);
                          c.setRequestProperty("User-Agent","Mozilla/5.0 (Android) LauraChristmas/2.1");
                          int status=c.getResponseCode();
                          if(status!=200){problem="News service HTTP "+status;continue;}
                          JSONArray articles=parseRss(readStream(c.getInputStream(),600000));
                          if(articles.length()>0)return new JSONObject().put("ok",true).put("items",articles);
                      } catch(Exception e) {problem=networkError(e);}
                      finally {if(c!=null)c.disconnect();}
                  }
                  return error("Christmas News unavailable: "+problem+". Try Test connection.");
              }

          '''+java[end:]
          java=java.replace('if (key.isEmpty()) return error("Set up an OpenAI API key in Settings first.");',
          '''if (key.isEmpty()) return error("Add an OpenAI API key in Settings.");
                  if (!key.startsWith("sk-")) return error("This is not an OpenAI API key. Update the key in Settings.");''',1)
          java=java.replace('return error("AI request returned HTTP " + code + ". Check your API key, billing, or internet connection.");',
          '''if(code==401)return error("OpenAI 401: invalid API key");
                          if(code==429)return error("OpenAI 429: billing or usage limit");
                          return error("OpenAI returned HTTP "+code);''',1)
          java=java.replace('return error("Could not reach the AI service. Please check internet access and try again.");',
          'return error("OpenAI: "+networkError(e));',1)
          jf.write_text(java,encoding='utf-8')
          assert 'newsBusy:false,aiBusy:false' in js
          js=js.replace('newsBusy:false,aiBusy:false',
              'newsBusy:false,connectionBusy:false,connectionChecks:[],aiBusy:false',1)
          header='<div class="section-head"><h2>🤖 Ask Christmas Scout AI</h2>'
          assert header in js
          js=js.replace(header,'''<div class="panel frost"><strong>🌐 Test internet connection</strong>
          <p class="item-sub">Checks Christmas News and OpenAI individually.</p>
          <button class="btn secondary" data-check-net="1">${ui.connectionBusy?'Testing…':'Test connection'}</button>
          ${ui.connectionChecks.map(c=>`<p class="item-sub">${c.ok?'✅':'❌'} ${x(c.name)}: ${x(c.detail)}</p>`).join('')}</div>'''+header,1)
          assert 'if(d.refreshNews){fetchNews(true);return}' in js
          js=js.replace('if(d.refreshNews){fetchNews(true);return}',
              'if(d.checkNet){checkNet();return}\n if(d.refreshNews){fetchNews(true);return}',1)
          assert 'function aiAsk(prompt)' in js
          js=js.replace('function aiAsk(prompt)', '''function checkNet(){
           if(ui.connectionBusy)return;
           if(!window.AndroidStore?.checkConnection)return toast('Connection test unavailable');
           ui.connectionBusy=true;ui.connectionChecks=[];render();
           AndroidStore.checkConnection();
          }
          window.onNativeConnection=function(payload){
           ui.connectionBusy=false;
           try{ui.connectionChecks=JSON.parse(payload).checks||[]}
           catch(e){toast('Connection test failed')}
           if(ui.page==='updates')render();
          };
          function aiAsk(prompt)''',1)
          js=js.replace('Version 2.0 • Frosty Blue','Version 2.1.2 • Frosty Blue',1)
          sf.write_text(js,encoding='utf-8')
          gradle=re.sub(r'\bversionCode\s+\d+','versionCode 212',gradle)
          gradle=gradle.replace("versionName '2.0.0'","versionName '2.1.2'")
          gf.write_text(gradle,encoding='utf-8')
          assert 'parseRss(' in java and 'DocumentBuilderFactory factory =' not in java
          print('News parser fixed: Laura v2.1.2 ready')
          PYTHON

      - name: Verify app source
        run: |
          grep -Fq "versionName '2.1.2'" christmas_organiser_android/app/build.gradle
          grep -Fq 'android.util.Xml.newPullParser()' christmas_organiser_android/app/src/main/java/uk/co/christmas/organiser/MainActivity.java
          node --check christmas_organiser_android/app/src/main/assets/app.js

      - name: Build APK
        working-directory: christmas_organiser_android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp christmas_organiser_android/app/build/outputs/apk/debug/app-debug.apk dist/Lauras-Christmas-App-v2-1-2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauras-Christmas-App-v2-1-2
          path: dist/Lauras-Christmas-App-v2-1-2.apk
          if-no-files-found: error
          retention-days: 30
