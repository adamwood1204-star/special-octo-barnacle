
name: Build Laura's Christmas App APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo 'Android sdkmanager not found'
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Christmas app
        shell: bash
        run: |
          test -f christmas_organiser_android_source.zip
          unzip -q christmas_organiser_android_source.zip
          test -f christmas_organiser_android/app/build.gradle

      - name: Build Laura's Christmas App APK
        working-directory: christmas_organiser_android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauras-Christmas-App-APK
          path: christmas_organiser_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
