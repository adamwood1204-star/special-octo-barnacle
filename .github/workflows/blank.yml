
name: Build Laura's Christmas App V2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Laura's Christmas App V2
    runs-on: ubuntu-24.04

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Laura's Christmas App V2
        shell: bash
        run: |
          if [ ! -f christmas_organiser_android_source.zip ]; then
            echo "::error::App source ZIP is missing"
            exit 1
          fi

          unzip -oq christmas_organiser_android_source.zip

          if [ ! -f christmas_organiser_android/app/build.gradle ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          echo "Android project extracted successfully"

      - name: Check for Version 2 AI features
        shell: bash
        run: |
          APP_ASSETS="christmas_organiser_android/app/src/main/assets"

          if [ ! -d "$APP_ASSETS" ]; then
            echo "::error::App assets are missing"
            exit 1
          fi

          if ! grep -Riq "Christmas Scout" "$APP_ASSETS"; then
            echo "::error::This appears to be the old app ZIP. Upload the new Version 2 source ZIP."
            exit 1
          fi

          echo "Version 2 features detected"

      - name: Build Laura's Christmas App
        working-directory: christmas_organiser_android
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare Version 2 APK
        shell: bash
        run: |
          mkdir -p dist

          cp christmas_organiser_android/app/build/outputs/apk/debug/app-debug.apk \
            dist/Lauras-Christmas-App-V2.apk

          echo "Laura's Christmas App V2 APK ready"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauras-Christmas-App-V2
          path: dist/Lauras-Christmas-App-V2.apk
          if-no-files-found: error
          retention-days: 30
