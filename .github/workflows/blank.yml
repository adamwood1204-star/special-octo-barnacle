
name: Build Laura's Christmas App APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Christmas app
        run: unzip -q christmas_organiser_android_source.zip

      - name: Build APK
        working-directory: christmas_organiser_android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lauras-Christmas-App-APK
          path: christmas_organiser_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
